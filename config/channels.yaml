# ROI 校準設定：每台三個區塊的比例座標 (0~1)
# x1,y1 = 左上角比例座標；x2,y2 = 右下角比例座標
# 影片解析度請看 tools/check_env.py 的輸出；用比例座標可以不受解析度影響
#   headline_bar: 主標題 bar（新聞標題/五字標顯示區，注意排除旁邊的口白字幕/地點/股市小部件）
#   ticker       : 跑馬燈
#   logo         : 台標
# 這些是依實際截圖抓的粗略預設值，請對照 out/calib/roi_preview.jpg 自行微調後重跑：
#   python tools/calibrate.py --preview-only

ftv:
  headline_bar:
    # 注意：畫面左側 (x 0~0.27 左右) 還有一個跟當前新聞內容無關、會自己循環/
    # 停留很久的次要headline小方塊（實測內容如「金管會將提救市措施」「高金被
    # 求判14年」等，在不相鄰的分鐘重複出現，證實是獨立跑馬燈式的区块，不是
    # 真正跟著新聞走的主標題），框選時刻意排除、從右側真正的主標題寬 bar 開始。
    x1: 0.27
    y1: 0.78
    x2: 1.0
    y2: 0.9
  ticker:
    x1: 0.0
    y1: 0.9
    x2: 1.0
    y2: 0.98
  logo:
    x1: 0.78
    y1: 0.05
    x2: 0.99
    y2: 0.14

tvbs:
  headline_bar:
    x1: 0.2
    y1: 0.8
    x2: 1.0
    y2: 0.9
  ticker:
    x1: 0.0
    y1: 0.9
    x2: 1.0
    y2: 0.98
  logo:
    x1: 0.76
    y1: 0.04
    x2: 0.99
    y2: 0.11

ebc:
  headline_bar:
    x1: 0.0
    y1: 0.79
    x2: 1.0
    y2: 0.89
  ticker:
    x1: 0.0
    y1: 0.9
    x2: 1.0
    y2: 0.98
  logo:
    x1: 0.74
    y1: 0.04
    x2: 0.98
    y2: 0.11

cts:
  headline_bar:
    # 跟 ftv 同樣的問題：畫面左側 (x 0~0.15 左右) 是跟當前新聞無關、會自己循環
    # 停留很久的次要小方塊（實測「張俊傑偷渡跑了 關鍵12分鐘曝光」在不相鄰的
    # 分鐘重複出現），真正的主標題 bar 在它右側、幾乎佔滿剩餘寬度。
    # 已知限制：CTS 遇到「資料畫面」類報導時，真正的主標題會改顯示在畫面最
    # 上方（不在這個 ROI 內），這個 ROI 只能涵蓋一般棚內/連線格式。
    x1: 0.15
    y1: 0.78
    x2: 1.0
    y2: 0.89
  ticker:
    x1: 0.0
    y1: 0.9
    x2: 1.0
    y2: 0.98
  logo:
    x1: 0.78
    y1: 0.02
    x2: 0.99
    y2: 0.09
